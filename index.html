<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feeling Good, Living Well Enjoying the Little Moments at Home</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600') center/cover;
}

.player{
width:95%;
max-width:1000px;
background:#181818;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,.6);
}

.video-box{
position:relative;
}

video{
width:100%;
display:block;
background:#000;
}

.logo{
position:absolute;
top:15px;
left:15px;
background:#e50914;
padding:8px 14px;
border-radius:8px;
font-weight:bold;
}

.info{
padding:25px;
}

.info h1{
font-size:28px;
margin-bottom:10px;
}

.info p{
color:#ccc;
line-height:1.6;
margin-bottom:20px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.btn{
padding:12px 22px;
background:#e50914;
color:#fff;
text-decoration:none;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#ff2b2b;
}

.btn2{
background:#333;
}

.btn2:hover{
background:#555;
}

footer{
padding:20px;
text-align:center;
color:#888;
font-size:14px;
}

@media(max-width:768px){

.info h1{
font-size:22px;
}

.hero{
height:auto;
padding:30px 0;
}

}
</style>

</head>
<body>

<section class="hero">

<div class="player">

<div class="video-box">

<div class="logo">
BIGS VIDEO
</div>

<video
controls
playsinline
preload="metadata"
controlsList="nodownload">

<source src="https://cdn2.videy.co/g1m0dkKB1.mp4" type="video/mp4">

</video>

</div>

<div class="info">

<h1>Streaming Video HD</h1>

<p>
Bigs Videoxstars.
</p>

<div class="buttons">

<a class="btn" href="https://t.co/azEBWYcWWY">
▶ Play Next Video
</a>

<a class="btn btn2"
href="javascript:document.querySelector('video').requestFullscreen();">
⛶ Fullscreen
</a>

</div>

</div>

</div>

</section>

<footer>
© Bigs Videoxstars
</footer>

</body>
